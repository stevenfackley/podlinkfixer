# Dependabot configuration.
#
# Policy (matches the SquareLog dependabot-sweep policy):
#   * minor + patch updates are grouped per ecosystem so one monthly PR
#     catches them all; majors stay separate so each gets its own review.
#   * everything runs monthly (06:00 America/New_York), at most 3 open
#     PRs per ecosystem (fleet guardrail, 2026-09-04).
#
# Ecosystem directories below were derived from the manifests actually
# present in this repo. Updaters that do not recurse (npm, pip, docker,
# terraform, gomod) get one directory listed per manifest location.
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      javascript-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(github-actions)"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
